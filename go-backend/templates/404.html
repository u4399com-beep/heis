{{define "404"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - 页面走丢了 · {{.Site.Title}}</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="您访问的页面不存在或已走丢，可返回首页继续浏览本站小说。">
<style>
  :root {
    --bg: #0b1120;
    --bg-2: #0f172a;
    --card: #131c2e;
    --card-2: #1c2942;
    --border: #243049;
    --border-2: #2c3a59;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #10b981;
    --accent-2: #059669;
    --warn: #f59e0b;
    --err: #ef4444;
    --info: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  a { color: var(--info); text-decoration: none; }
  a:hover { color: #7dd3fc; }
  .stage {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 48px 36px; max-width: 560px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
    text-align: center;
  }
  .code {
    font-size: 96px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--info) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px; margin-bottom: 8px;
  }
  .title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .desc { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 22px; border-radius: 8px; border: 1px solid var(--border-2);
    background: var(--card-2); color: var(--text); cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all .15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--card); border-color: var(--border-2); }
  .btn-primary { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent); }
  .search {
    margin-top: 24px; display: flex; gap: 8px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px;
  }
  .search input {
    flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; outline: none;
    min-width: 0;
  }
  .search input:focus { border-color: var(--accent); }
  .search button {
    padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent-2); color: #fff; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  .search button:hover { background: var(--accent); }
  .meta { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border);
    color: var(--dim); font-size: 12px; }
  .meta a { color: var(--muted); }
  .meta a:hover { color: var(--info); }
  @media (max-width: 540px) {
    .card { padding: 32px 20px; }
    .code { font-size: 72px; }
    .title { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="stage">
<div class="card">
<div class="code">404</div>
<div class="title">您访问的页面走丢了</div>
<div class="desc">很抱歉，您寻找的页面不存在或已被移除。可以返回首页继续浏览，或试试搜索您感兴趣的小说。</div>
<div class="actions">
<a href="{{.HomeURL}}" class="btn btn-primary">返回首页</a>
<a href="javascript:history.back()" class="btn">返回上一页</a>
</div>
<form class="search" action="/?view=search" method="get">
<input type="text" name="q" placeholder="搜索书名、作者或标签…" autocomplete="off">
<button type="submit">搜索</button>
</form>
<div class="meta">
<span>{{.Site.Name}}{{if .Site.Domain}} · {{.Site.Domain}}{{end}}</span>
{{if .PseudoStyle}} · 伪静态风格: {{.PseudoStyle}}{{end}}
</div>
</div>
</div>
</body>
</html>{{end}}
